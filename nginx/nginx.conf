
server {
    listen 80;
    server_name  matjark.duckdns.org;

    # Location for ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
        allow all;
    }

    # Uncomment this redirect after SSL certificates are set up
    location / {
        return 301 https://$server_name$request_uri;
    }
}




# API HTTPS server
server {
    listen 443 ssl http2;
    server_name matjark.duckdns.org;

    # SSL certificate for the API
    ssl_certificate /etc/letsencrypt/live/matjark.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matjark.duckdns.org/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
