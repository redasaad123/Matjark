# # Frontend HTTP server (temporary - serving until SSL certificates are ready)
server {
    listen 80;
    server_name walaa-plus.com www.walaa-plus.com;

    # Location for ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
        allow all;
    }

    # API proxy (should be defined before catch-all location)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Handle static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Root directory for frontend files
    root /var/www/frontend;
    index index.html;

    # Handle frontend routes (SPA) - this should be last
    location / {
        return 301 https://$host$request_uri;

    }
}

# # API HTTP server
server {
    listen 80;
    server_name  api.walaa-plus.com;

    # Location for ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
        allow all;
    }

    # Uncomment this redirect after SSL certificates are set up
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Frontend HTTPS server
server {
    listen 443 ssl http2;
    server_name walaa-plus.com www.walaa-plus.com;

    # SSL certificate for the frontend
    ssl_certificate /etc/letsencrypt/live/api.walaa-plus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.walaa-plus.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    
    # Root directory for frontend files
    root /var/www/frontend;
    index index.html;

    # Handle static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy (if you want to serve API under the same domain)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Handle frontend routes (SPA) - this should be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API HTTPS server
server {
    listen 443 ssl http2;
    server_name api.walaa-plus.com;

    # SSL certificate for the API
    ssl_certificate /etc/letsencrypt/live/api.walaa-plus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.walaa-plus.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
