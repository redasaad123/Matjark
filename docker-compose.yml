version: '3.8'

services:
  # مثال لخدمة ويب
  backend:
    build: .
    image: redasaad123/walaaplus:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - webnet
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./webroot:/var/www/html
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
    networks:
      - webnet
    command: certonly --webroot --webroot-path=/var/www/html --email support@walaa-plus.com --agree-tos --no-eff-email --force-renewal  -d api.walaa-plus.com  -d www.walaa-plus.com -d walaa-plus.com
    restart: "no"
  
  certbot-renew:
    image: certbot/certbot
    volumes:
      - ./webroot:/var/www/html
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done;"
    networks:
      - webnet
    restart: unless-stopped





networks:
  webnet:

volumes:
  webroot:
  certbot-etc:
  certbot-var:
