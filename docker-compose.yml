services:
  backend:
    build: .
    image: redasaad123/matgark:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    expose:
      - "8000"
    networks:
      - webnet
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./webroot:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
    networks:
      - webnet
    command: certonly --webroot --webroot-path=/var/www/html --email support.matjark.duckdns.org --agree-tos --no-eff-email --non-interactive -d matjark.duckdns.org -d www.matjark.duckdns.org
    restart: "no"

  certbot-renew:
    image: certbot/certbot
    volumes:
      - ./webroot:/var/www/html
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done;"
    networks:
      - webnet
    restart: unless-stopped

networks:
  webnet: